<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chat</title>
    <style>
        :root {
            --bg-color: #050505;
            --chat-bg: #121212;
            --accent-red: #ff0000;
            --border-gray: #2a2a2a;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: var(--chat-bg);
            border: 1px solid var(--accent-red);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
        }

        header {
            padding: 15px;
            background: #000;
            border-bottom: 1px solid var(--accent-red);
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--accent-red);
            text-transform: uppercase;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Scrollbar Styling */
        #messages::-webkit-scrollbar { width: 5px; }
        #messages::-webkit-scrollbar-thumb { background: var(--accent-red); }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 4px;
            line-height: 1.5;
            border: 1px solid transparent;
        }

        .user {
            align-self: flex-end;
            background: #1a1a1a;
            border-color: var(--accent-red);
            color: #fff;
        }

        .bot {
            align-self: flex-start;
            background: #000;
            border-color: var(--border-gray);
            border-left: 3px solid var(--accent-red);
        }

        .input-area {
            display: flex;
            padding: 20px;
            background: #000;
            border-top: 1px solid var(--border-gray);
            gap: 10px;
        }

        input {
            flex: 1;
            background: #121212;
            border: 1px solid var(--border-gray);
            color: white;
            padding: 12px;
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-red);
        }

        button {
            background: var(--accent-red);
            color: black;
            border: none;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        button:hover {
            background: #cc0000;
            box-shadow: 0 0 10px var(--accent-red);
        }
    </style>
</head>
<body>

<div id="chat-container">
    <header>Oikko's Terminal</header>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">SEND</button>
    </div>
</div>

<script>
    const MODEL = 'my-custom-model'; // Use the name you chose in Step 2
    const messagesContainer = document.getElementById('messages');
    const userInput = document.getElementById('userInput');

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Append User Message
        appendMessage('user', text);
        userInput.value = '';

        // Create Bot Message Placeholder
        const botMsgDiv = appendMessage('bot', '...');
        let fullContent = "";

        try {
            const response = await fetch('http://localhost:11434/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [{ role: 'user', content: text }],
                    stream: true
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            botMsgDiv.innerText = ""; // Clear the "..."

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (!line.trim()) continue;
                    const json = JSON.parse(line);
                    if (json.message && json.message.content) {
                        fullContent += json.message.content;
                        botMsgDiv.innerText = fullContent;
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                }
            }
        } catch (error) {
            botMsgDiv.innerText = "Error: Ensure Ollama is running with OLLAMA_ORIGINS='*'";
            botMsgDiv.style.borderColor = "orange";
        }
    }

    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.innerText = text;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return msgDiv;
    }

    // Allow "Enter" key to send
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
